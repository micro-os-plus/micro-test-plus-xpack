# https://micro-os-plus.github.io/micro-test-plus-xpack/
# https://github.com/micro-os-plus/micro-test-plus-xpack/actions/workflows/test-pr.yml

# Workflow for running some tests on each Pull Request.
name: Test on Pull Request

# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
# https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows

on:
  # Runs on pull requests, if all conditions are met:
  pull_request:
    # ... on the active branches ...
    branches:
      - 'xpack-development'
      - 'xpack'
    # ... skip tags only ...
    tags-ignore:
      - '**'
    # ... include everything except ...
    paths-ignore:
      - '.claude/**'
      - '.github/skills/**'
      - '.github/workflows/publish-github-pages.yml'
      - '.github/workflows/test-all.yml'
      - '.github/copilot-instructions.md'
      - '.github/FUNDING.yml'
      - '.settings/**'
      - '.vscode/**'
      - 'config/**'
      - 'docs/**'
      - 'scripts/**'
      - 'tests/scripts/**'
      - 'website/**'
      - 'LICENSE*'
      - '**.md'
      - '.gitignore'
      - '.npmignore'
      - '**/README**'

# Allow one concurrent run per pull request; new pushes cancel older runs.
# https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: "tests-pr-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

# Pull requests from forks must not get write access.
permissions:
  contents: read

jobs:
  ci-test:
    name: 'µTest++ Testing Framework PR tests'

    runs-on: ${{ matrix.os }}

    strategy:
      # Do not cancel the other matrix jobs if one of them fails.
      fail-fast: false
      matrix:
        # https://github.com/actions/runner-images
        os:
          [
            'ubuntu-24.04',
            'ubuntu-24.04-arm',
            'macos-15-intel',
            'macos-15',
            'windows-2025',
          ]
        # https://nodejs.org/en - use LTS
        node-version: [ '24' ]
        # https://www.npmjs.com/package/xpm
        xpm-version: [ '0.23.2' ]

    steps:
      - name: Checkout
        # https://github.com/actions/checkout/
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 3

      - name: Setup Node.js ${{ matrix.node-version }} on ${{ matrix.os }}
        # https://github.com/actions/setup-node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install xpm@${{ matrix.xpm-version }} on ${{ matrix.os }}
        run: npm install -g xpm@${{ matrix.xpm-version }}

      - name: Show environment
        run: |
          id
          uname -a
          node --version
          npm --version
          xpm --version
          env | sort

      - name: Satisfy project dependencies on ${{ matrix.os }}
        run: |
          npm ci
          npm --prefix tests ci
          xpm install -C tests
          xpm run install-ci -C tests

      - name: Run tests on ${{ matrix.os }}
        run: xpm run test-ci -C tests
        env:
          CI: true
