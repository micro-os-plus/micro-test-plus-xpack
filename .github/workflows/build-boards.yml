# https://micro-os-plus.github.io/micro-test-plus-xpack/
# https://github.com/micro-os-plus/micro-test-plus-xpack/actions/workflows/test-ci.yml

# Workflow for building the physical boards binaries.
name: Build boards binaries

# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
# https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows

on:
  # Runs on manual triggering.
  workflow_dispatch:

# Allow one concurrent run.
# https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: 'build-binaries'
  # A new manual trigger cancels the older run.
  cancel-in-progress: true

jobs:
  build-boards:
    name: 'Build µTest++ Testing Framework boards binaries'

    runs-on: ${{ matrix.os }}

    strategy:
      # Run all platforms to completion, even if one fails.
      fail-fast: false
      matrix:
        # https://github.com/actions/runner-images
        os:
          [
            'ubuntu-26.04',
            'ubuntu-24.04',
            'ubuntu-22.04',
            'ubuntu-26.04-arm',
            'ubuntu-24.04-arm',
            'ubuntu-22.04-arm',
            'macos-26-intel',
            'macos-15-intel',
            'macos-26',
            'macos-15',
            'windows-2025',
            'windows-2022'
          ]
        # https://nodejs.org/en - use LTS
        node-version: ['24']
        # https://www.npmjs.com/package/xpm
        xpm-version: ['0.23.2']

    steps:
      - name: Checkout
        # https://github.com/actions/checkout/
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 3

      - name: Setup Node.js ${{ matrix.node-version }} on ${{ matrix.os }}
        # https://github.com/actions/setup-node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install xpm@${{ matrix.xpm-version }} on ${{ matrix.os }}
        run: npm install -g xpm@${{ matrix.xpm-version }}

      - name: Show environment
        run: |
          id
          uname -a
          node --version
          npm --version
          xpm --version
          env | sort

      - name: Clean xPack cache Linux
        if: runner.os == 'Linux'
        run: |
          rm -rf "${HOME}/.cache/xPacks"

      - name: Clean xPack cache macOS
        if: runner.os == 'macOS'
        run: |
          rm -rf "${HOME}/Library/Caches/xPacks"

      - name: Clean xPack cache Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cachePath = "$env:LOCALAPPDATA\Caches\xPacks"
          if (Test-Path -LiteralPath $cachePath) {
            Remove-Item -LiteralPath $cachePath -Force -Recurse -ErrorAction SilentlyContinue
          }

      - name: Satisfy project dependencies on ${{ matrix.os }}
        run: |
          npm ci
          npm --prefix tests ci
          xpm install -C tests

      - name: Satisfy boards dependencies on ${{ matrix.os }}
        run: |
          xpm run install-boards -C tests

      - name: Run board compile tests on ${{ matrix.os }}
        run: xpm run build-boards -C tests
        env:
          CI: true
